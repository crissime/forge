services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_master
    ports:
      - "5432:5432"
    volumes:
      - forge-master-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_master"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge_master?schema=public
      COOKIE_SECURE: "false"
      GAME_DATA_VERSION: "2026_05_23_14_08"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_ORIGIN: http://api:3001
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3002:3000"

volumes:
  forge-master-pg:
