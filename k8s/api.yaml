apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-master-api
  labels:
    app: forge-master-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-master-api
  template:
    metadata:
      labels:
        app: forge-master-api
    spec:
      containers:
        - name: api
          image: crissime/forgemaster-api:3.1.0@sha256:39972b4e9cc9de681a0ce5f602394f0098b1da22cf6ff93af1018b78ae276011
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: COOKIE_SECURE
              value: "true"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: forge-master-api
                  key: COOKIE_SECRET
            - name: GAME_DATA_VERSION
              value: "2026_05_23_14_08"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: forge-master-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 75m
              memory: 160Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forge-master-api
spec:
  type: ClusterIP
  selector:
    app: forge-master-api
  ports:
    - name: http
      port: 3001
      targetPort: http
