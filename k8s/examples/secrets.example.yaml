apiVersion: v1
kind: Secret
metadata:
  name: forge-master-api
type: Opaque
stringData:
  COOKIE_SECRET: replace-with-a-long-random-value
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-master-postgres
type: Opaque
stringData:
  POSTGRES_USER: forge
  POSTGRES_PASSWORD: replace-with-a-random-password
  POSTGRES_DB: forge_master
  DATABASE_URL: postgresql://forge:replace-with-a-random-password@forge-master-postgres:5432/forge_master?schema=public
