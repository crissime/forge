apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-master-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - forge.flotio.ovh
      secretName: forge-master-tls
  rules:
    - host: forge.flotio.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forge-master-web
                port:
                  number: 80
